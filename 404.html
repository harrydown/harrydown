<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 – Harry Down</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg?v=8" type="image/svg+xml">
<link rel="icon" href="favicon-32-dark.png?v=8" sizes="32x32" type="image/png"
      media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon-32-light.png?v=8" sizes="32x32" type="image/png"
      media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Self-contained on purpose: a 404 has to render even if a stylesheet is
     missing or cached from an older deploy. Tokens mirror css/style.css. */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; background: #000; color: #fff; }

  body {
    font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    -webkit-font-smoothing: antialiased;
  }

  .ui {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 24px;
  }

  .label {
    color: #fff;
    text-decoration: none;
    white-space: nowrap;
    padding: 0.3em 0.32em 0.3em 0.4em;
    margin: -0.3em -0.32em -0.3em -0.4em;
    transition: background-color 120ms ease, color 120ms ease;
  }

  a.label:hover,
  a.label:focus-visible {
    background-color: #fff;
    color: #000;
  }

  main {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.6em;
    padding: 72px 24px;
    text-align: center;
  }

  .code {
    font-size: 12px;
    line-height: 1.8;
  }

  @media (max-width: 700px) {
    .ui { padding: 16px; }
    body { font-size: 11px; }
  }
</style>
</head>
<body>
  <header class="ui">
    <a class="label" href="/">HARRY DOWN</a>
  </header>

  <main>
    <p class="code">404 — PAGE NOT FOUND</p>
    <a class="label" href="/">RETURN TO WORK</a>
  </main>
</body>
</html>
